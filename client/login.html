<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMA Burger - Login</title>
    <link rel="stylesheet" href="Style/style.css">
</head>
<body style="background-color: #F5F0E6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif;">

    <div class="form-card" style="width: 100%; max-width: 400px; padding: 30px; background: #FFFFFF; border-radius: 12px; box-shadow: 0 4px 15px rgba(59,42,34,0.1); border-left: 6px solid #A8B99A; border-top: 1px solid #A8B99A; border-right: 1px solid #A8B99A; border-bottom: 1px solid #A8B99A;">
        
        <!-- LOGO & TITLE SECTION -->
        <div style="text-align: center; margin-bottom: 25px;">
            <img src="Style/logo.png" alt="EMA Burger Logo" style="height: 55px; margin-bottom: 10px;">
            <h2 style="color: #3B2A22; margin: 0; font-size: 24px; font-weight: bold;">EMA BURGER</h2>
            <p style="color: #3B2A22; opacity: 0.8; font-size: 14px; margin-top: 5px;">Please login to access the dashboard</p>
        </div>

        <form id="loginForm">
            <div class="form-group" style="margin-bottom: 15px;">
                <label for="username" style="font-size: 13px; color: #3B2A22; display: block; margin-bottom: 5px; font-weight: 600;">Username</label>
                <input type="text" id="username" required style="width: 100%; padding: 11px; font-size: 14px; border-radius: 6px; border: 1px solid #A8B99A; background-color: #F5F0E6; color: #3B2A22; box-sizing: border-box;">
            </div>

            <div class="form-group" style="margin-bottom: 25px;">
                <label for="password" style="font-size: 13px; color: #3B2A22; display: block; margin-bottom: 5px; font-weight: 600;">Password</label>
                <input type="password" id="password" required style="width: 100%; padding: 11px; font-size: 14px; border-radius: 6px; border: 1px solid #A8B99A; background-color: #F5F0E6; color: #3B2A22; box-sizing: border-box;">
            </div>

            <button type="submit" class="submit-btn" style="width: 100%; padding: 12px; background: #D89B45; color: #1F211E; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s;">🔐 ግባ (Login)</button>
        </form>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const user = document.getElementById("username").value.trim();
            const pass = document.getElementById("password").value.trim();

            // 1. የባለቤቱ መለያ (owner ሲገባ ወደ index.html ዳሽቦርድ ይሄዳል)
            if (user === "owner" && pass === "owner123") {
                localStorage.setItem("userRole", "owner");
                window.location.href = "index.html";
                return;
            }

            // 2. ባለቤቱ በ reports.html በኩል ያስመዘገባቸው አዳዲስ ካሸሮች ብቻ መኖራቸውን ማረጋገጥ
            const savedCashiers = JSON.parse(localStorage.getItem("emaCashiers")) || [];
            const foundCashier = savedCashiers.find(c => c.username === user && c.password === pass);

            if (foundCashier) {
                localStorage.setItem("userRole", "cashier");
                window.location.href = "index.html";
            } else {
                alert("Invalid Username or Password!");
            }
        });
    </script>
</body>
</html>
