<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMA Burger - Login</title>
    <link rel="stylesheet" href="Style/style.css">
</head>
<body style="background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">

    <div class="form-card" style="width: 100%; max-width: 400px; padding: 30px; background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-left: 5px solid #2575fc;">
        <div style="text-align: center; margin-bottom: 20px;">
            <h2 style="color: #333; margin: 0;">EMA BURGER</h2>
            <p style="color: #666; font-size: 14px;">እባክዎ ወደ ስርአቱ ለመግባት ይግቡ</p>
        </div>

        <form id="loginForm">
            <div class="form-group" style="margin-bottom: 15px;">
                <label for="username" style="font-size: 13px; color: #666; display: block; margin-bottom: 5px;">Username</label>
                <input type="text" id="username" required style="width: 100%; padding: 10px; font-size: 14px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box;">
            </div>

            <div class="form-group" style="margin-bottom: 20px;">
                <label for="password" style="font-size: 13px; color: #666; display: block; margin-bottom: 5px;">Password</label>
                <input type="password" id="password" required style="width: 100%; padding: 10px; font-size: 14px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box;">
            </div>

            <button type="submit" class="submit-btn" style="width: 100%; padding: 12px; background: #2575fc; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer;">🔐 ግባ (Login)</button>
        </form>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const user = document.getElementById("username").value.trim();
            const pass = document.getElementById("password").value.trim();

            // የባለቤቱ እና የካሸርዋ መለያዎች (Username እና Password እዚህ መቀየር ትችላለህ)
            if (user === "owner" && pass === "owner123") {
                localStorage.setItem("userRole", "owner");
                window.location.href = "index.html";
            } else if (user === "cashier" && pass === "cashier123") {
                localStorage.setItem("userRole", "cashier");
                window.location.href = "index.html";
            } else {
                alert("የተሳሳተ Username ወይም Password!");
            }
        });
    </script>
</body>
</html>
